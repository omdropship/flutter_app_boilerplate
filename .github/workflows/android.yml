name: Build ChatTeman APK - Diagnostic Mode

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ChatTeman APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT PROJECT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true


      # ============================================================
      # 4. ENVIRONMENT DIAGNOSTIC
      # ============================================================
      - name: Diagnostic - Environment
        run: |
          echo "============================================================"
          echo "CHAT TEMAN - ENVIRONMENT DIAGNOSTIC"
          echo "============================================================"

          echo ""
          echo "========== FLUTTER VERSION =========="
          flutter --version

          echo ""
          echo "========== DART VERSION =========="
          dart --version

          echo ""
          echo "========== JAVA VERSION =========="
          java -version

          echo ""
          echo "========== FLUTTER DOCTOR =========="
          flutter doctor -v

          echo ""
          echo "========== FLUTTER CONFIG =========="
          flutter config

          echo ""
          echo "============================================================"
          echo "ENVIRONMENT DIAGNOSTIC SELESAI"
          echo "============================================================"


      # ============================================================
      # 5. CEK STRUKTUR PROJECT
      # ============================================================
      - name: Diagnostic - Project Structure
        run: |
          echo "============================================================"
          echo "PROJECT STRUCTURE"
          echo "============================================================"

          echo ""
          echo "========== ROOT PROJECT =========="
          ls -la

          echo ""
          echo "========== ANDROID DIRECTORY =========="
          if [ -d "android" ]; then
            ls -la android
          else
            echo "WARNING: folder android tidak ditemukan"
          fi

          echo ""
          echo "========== LIB DIRECTORY =========="
          if [ -d "lib" ]; then
            find lib -maxdepth 3 -type f | sort
          else
            echo "WARNING: folder lib tidak ditemukan"
          fi

          echo ""
          echo "============================================================"


      # ============================================================
      # 6. TAMPILKAN PUBSPEC
      # ============================================================
      - name: Diagnostic - pubspec.yaml
        run: |
          echo "============================================================"
          echo "ISI PUBSPEC.YAML"
          echo "============================================================"

          if [ -f "pubspec.yaml" ]; then
            cat pubspec.yaml
          else
            echo "::error::pubspec.yaml tidak ditemukan"
            exit 1
          fi

          echo ""
          echo "============================================================"


      # ============================================================
      # 7. FLUTTER PUB GET
      # ============================================================
      - name: Install dependencies
        id: pub_get
        shell: bash
        run: |
          set -o pipefail

          echo "============================================================"
          echo "STEP: FLUTTER PUB GET"
          echo "============================================================"

          echo ""
          echo "Dart yang digunakan:"
          dart --version

          echo ""
          echo "Menjalankan flutter pub get..."
          echo "Log lengkap akan disimpan ke pub_get.log"
          echo ""

          flutter pub get -v 2>&1 | tee pub_get.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "============================================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo "::error::FLUTTER PUB GET GAGAL"

            echo ""
            echo "============================================================"
            echo "PUB GET GAGAL - LOG LENGKAP"
            echo "============================================================"

            cat pub_get.log

            echo ""
            echo "============================================================"
            echo "INFORMASI ERROR YANG TERDETEKSI"
            echo "============================================================"

            grep -i -E \
              "Because|requires|depends on|version solving|failed|error|incompatible|conflict|SDK constraint|not compatible" \
              pub_get.log || true

            echo ""
            echo "============================================================"
            echo "AKHIR LOG PUB GET"
            echo "============================================================"

            tail -200 pub_get.log

            exit "$EXIT_CODE"
          fi

          echo "PUB GET BERHASIL"

          echo ""
          echo "============================================================"


      # ============================================================
      # 8. CEK DEPENDENCY YANG TERRESOLVE
      # ============================================================
      - name: Diagnostic - Resolved dependencies
        if: success()
        run: |
          echo "============================================================"
          echo "RESOLVED DEPENDENCIES"
          echo "============================================================"

          flutter pub deps --style=compact

          echo ""
          echo "============================================================"


      # ============================================================
      # 9. PUB OUTDATED - INFORMASI SAJA
      # ============================================================
      - name: Diagnostic - Dependency information
        if: success()
        continue-on-error: true
        run: |
          echo "============================================================"
          echo "DEPENDENCY INFORMATION"
          echo "============================================================"

          flutter pub outdated

          echo ""
          echo "============================================================"


      # ============================================================
      # 10. BUILD RUNNER
      # ============================================================
      - name: Generate code - build_runner
        id: build_runner
        shell: bash
        run: |
          set -o pipefail

          echo "============================================================"
          echo "STEP: BUILD RUNNER"
          echo "============================================================"

          echo ""
          echo "Menjalankan:"
          echo "dart run build_runner build --delete-conflicting-outputs"
          echo ""

          dart run build_runner build \
            --delete-conflicting-outputs \
            -v 2>&1 | tee build_runner.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "============================================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo "::error::BUILD RUNNER GAGAL"

            echo ""
            echo "============================================================"
            echo "BUILD RUNNER GAGAL - LOG LENGKAP"
            echo "============================================================"

            cat build_runner.log

            echo ""
            echo "============================================================"
            echo "ERROR / EXCEPTION YANG TERDETEKSI"
            echo "============================================================"

            grep -i -E \
              "error|exception|failed|failure|invalid|conflict|not found|unsupported|requires|cannot|could not" \
              build_runner.log || true

            echo ""
            echo "============================================================"
            echo "AKHIR LOG BUILD RUNNER"
            echo "============================================================"

            tail -300 build_runner.log

            exit "$EXIT_CODE"
          fi

          echo "BUILD RUNNER BERHASIL"

          echo ""
          echo "============================================================"


      # ============================================================
      # 11. CEK GENERATED FILE
      # ============================================================
      - name: Diagnostic - Generated files
        if: success()
        run: |
          echo "============================================================"
          echo "GENERATED FILES"
          echo "============================================================"

          find lib -type f \
            \( -name "*.g.dart" -o -name "*.freezed.dart" \) \
            -print 2>/dev/null | sort || true

          echo ""
          echo "============================================================"


      # ============================================================
      # 12. BUILD APK RELEASE
      # ============================================================
      - name: Build APK release
        id: build_apk
        shell: bash
        run: |
          set -o pipefail

          echo "============================================================"
          echo "STEP: FLUTTER BUILD APK RELEASE"
          echo "============================================================"

          echo ""
          echo "Menjalankan flutter build apk --release..."
          echo "Log lengkap akan disimpan ke build_apk.log"
          echo ""

          flutter build apk --release -v 2>&1 | tee build_apk.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "============================================================"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo "::error::BUILD APK GAGAL"

            echo ""
            echo "============================================================"
            echo "BUILD APK GAGAL - LOG LENGKAP"
            echo "============================================================"

            cat build_apk.log

            echo ""
            echo "============================================================"
            echo "ERROR / FAILURE YANG TERDETEKSI"
            echo "============================================================"

            grep -i -E \
              "error|exception|failure|failed|compile|gradle|kotlin|java|android|resource|manifest|unsupported|deprecated" \
              build_apk.log || true

            echo ""
            echo "============================================================"
            echo "AKHIR LOG BUILD APK"
            echo "============================================================"

            tail -300 build_apk.log

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "============================================================"
          echo "BUILD APK BERHASIL"
          echo "============================================================"

          find build/app/outputs/flutter-apk \
            -maxdepth 1 \
            -type f \
            -ls || true

          echo ""
          echo "============================================================"


      # ============================================================
      # 13. CEK HASIL APK
      # ============================================================
      - name: Diagnostic - APK result
        if: success()
        run: |
          echo "============================================================"
          echo "HASIL APK"
          echo "============================================================"

          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then

            echo ""
            echo "APK BERHASIL DIBUAT"
            echo ""

            ls -lh build/app/outputs/flutter-apk/app-release.apk

            echo ""
            echo "SHA256:"
            sha256sum build/app/outputs/flutter-apk/app-release.apk

          else

            echo "::error::APK tidak ditemukan"
            exit 1

          fi

          echo ""
          echo "============================================================"


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chatteman-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


      # ============================================================
      # 15. UPLOAD SEMUA LOG JIKA GAGAL
      # ============================================================
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chatteman-diagnostic-logs
          path: |
            pub_get.log
            build_runner.log
            build_apk.log
          if-no-files-found: ignore
