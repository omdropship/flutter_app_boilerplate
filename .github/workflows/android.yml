name: Build ChatTeman APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Ambil source code
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Install Flutter
      # ==========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      # ==========================================================
      # 3. Cek Flutter
      # ==========================================================
      - name: Flutter Doctor
        run: |
          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"
          flutter --version

          echo ""
          echo "========================================"
          echo "DART VERSION"
          echo "========================================"
          dart --version

          echo ""
          echo "========================================"
          echo "FLUTTER DOCTOR"
          echo "========================================"
          flutter doctor -v

      # ==========================================================
      # 4. Cek struktur project
      # ==========================================================
      - name: Check Project
        run: |
          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          pwd

          echo ""
          echo "FILES:"
          find . -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "PUBSPEC:"
          cat pubspec.yaml

      # ==========================================================
      # 5. Install dependency
      # ==========================================================
      - name: Flutter Pub Get
        run: |
          set +e

          echo "========================================"
          echo "FLUTTER PUB GET"
          echo "========================================"

          flutter pub get

          EXIT_CODE=$?

          echo ""
          echo "PUB GET EXIT CODE: $EXIT_CODE"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "PUB GET GAGAL"
            echo "========================================"

            echo ""
            echo "PUBSPEC:"
            cat pubspec.yaml

            echo ""
            echo "FLUTTER VERSION:"
            flutter --version

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "PUB GET BERHASIL"

      # ==========================================================
      # 6. Analisa Dart
      # ==========================================================
      - name: Analyze
        run: |
          echo "========================================"
          echo "DART ANALYZE"
          echo "========================================"

          dart analyze

      # ==========================================================
      # 7. Build APK
      # ==========================================================
      - name: Build APK
        run: |
          set +e

          echo "========================================"
          echo "BUILD APK RELEASE"
          echo "========================================"

          flutter build apk --release

          EXIT_CODE=$?

          echo ""
          echo "BUILD EXIT CODE: $EXIT_CODE"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "BUILD APK GAGAL"
            echo "========================================"

            echo ""
            echo "FLUTTER DOCTOR:"
            flutter doctor -v

            echo ""
            echo "FLUTTER VERSION:"
            flutter --version

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "========================================"
          echo "BUILD APK BERHASIL"
          echo "========================================"

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print

      # ==========================================================
      # 8. Upload APK ke GitHub
      # ==========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatTeman-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
